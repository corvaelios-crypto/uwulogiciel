<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UwU Cafe - Caisse</title>
<meta name="apple-mobile-web-app-title" content="UwU Cafe">
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #fdf1fa;
    --bg-2: #ffe3f4;
    --panel: rgba(255,255,255,0.75);
    --panel-2: #fff0fb;
    --accent: #ff4fc3;
    --accent-2: #ff7ad1;
    --accent-3: #c93fb0;
    --text: #3a1030;
    --muted: #9a6a90;
    --border: rgba(255,79,195,0.18);
    --danger: #e5395f;
    --shadow: 0 8px 24px rgba(255,79,195,0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    overscroll-behavior: none;
    touch-action: manipulation;
    height: 100%;
  }
  body {
    margin: 0;
    font-family: 'Google Sans Flex', -apple-system, 'Segoe UI', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,122,209,0.25), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(255,79,195,0.15), transparent 50%),
      linear-gradient(180deg, var(--bg-2), var(--bg-1));
    background-attachment: fixed;
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes logoPop {
    from { opacity: 0; transform: scale(0.5) rotate(-8deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }

  header {
    position: relative;
    text-align: center;
    padding: 10px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-shrink: 0;
    animation: fadeSlideUp 0.5s ease both;
  }
  header .logo {
    animation: logoPop 0.6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .header-actions {
    position: absolute;
    right: 16px;
    top: 55%;
    transform: translateY(-50%);
    display: flex;
    gap: 8px;
  }
  .flavors-toggle {
    background: #fff;
    border: 2px solid var(--accent);
    color: var(--accent-3);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(255,79,195,0.15);
  }
  .flavors-toggle:active { transform: scale(0.95); }
  .flavors-toggle.active {
    background: var(--accent);
    color: #fff;
  }
  header .logo {
    width: 40px;
    height: 40px;
    object-fit: contain;
    filter: drop-shadow(0 3px 6px rgba(255,79,195,0.35));
  }
  header h1 {
    margin: 0;
    font-family: 'Pacifico', cursive;
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--accent-3);
  }
  header .sub {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
  }

  .layout {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 1300px;
    width: 100%;
    margin: 0 auto;
    padding: 0 12px 12px;
  }

  .combos-bar {
    flex-shrink: 0;
    animation: fadeSlideUp 0.5s ease both;
    animation-delay: 0.08s;
  }

  .lower {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 10px;
  }
  .lower .menu-cols {
    animation: fadeSlideUp 0.5s ease both;
    animation-delay: 0.16s;
  }
  .lower .cart-panel {
    animation: fadeSlideUp 0.5s ease both;
    animation-delay: 0.24s;
  }
  @media (max-width: 780px) {
    .lower {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
  }

  .menu-cols {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    height: 100%;
  }

  .menu-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    flex: 1;
  }
  .menu-col .card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .menu-col .grid-items {
    flex: 1;
    min-height: 0;
    align-content: center;
  }

  .section-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .section-title-nav {
    margin: 0;
    flex: 1;
    justify-content: center;
    text-align: center;
  }
  .section-arrow {
    background: var(--panel-2);
    border: 2px solid var(--border);
    color: var(--accent-3);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .section-arrow:active { background: var(--accent); color: #fff; transform: scale(0.92); }
  .section-arrow:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .section-arrow:disabled:active { background: var(--panel-2); color: var(--accent-3); transform: none; }

  .card {
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card.combos-card { padding: 10px 12px; }
  .cart-panel.card {
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
  }

  .section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin: 0 0 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 13px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), var(--accent-3));
  }

  .grid-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    grid-auto-rows: 1fr;
    gap: 8px;
  }
  .combos-bar .grid-items {
    grid-template-columns: repeat(4, 1fr);
  }
  @media (max-width: 780px) {
    .combos-bar .grid-items {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .item-btn {
    position: relative;
    background: #ffffff;
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 8px 6px 7px;
    cursor: pointer;
    text-align: center;
    font-size: 0.78rem;
    font-weight: 700;
    line-height: 1.2;
    min-height: 62px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    box-shadow: 0 2px 6px rgba(255,79,195,0.12);
  }
  .item-btn .name {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    font-family: 'Pacifico', cursive;
    font-weight: 400;
  }
  .item-btn:active {
    transform: scale(0.94);
    background: var(--panel-2);
    box-shadow: 0 1px 3px rgba(255,79,195,0.12);
  }
  .item-btn .title {
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 0.9rem;
  }
  .item-btn .desc {
    font-family: 'Google Sans Flex', -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--muted);
  }
  .item-btn .price {
    display: inline-block;
    color: #fff;
    background: var(--accent);
    font-weight: 800;
    font-size: 0.78rem;
    padding: 2px 9px;
    border-radius: 20px;
  }
  .combo-btn {
    background: linear-gradient(150deg, #ff4fc3, #ff7ad1 60%, #ffa8e0);
    border: 2px solid rgba(255,255,255,0.6);
    min-height: 88px;
    padding: 10px 10px 9px;
  }
  .combo-btn .name {
    flex-direction: column;
    gap: 2px;
  }
  .combo-btn, .combo-btn .desc { color: #fff; }
  .combo-btn .desc { color: rgba(255,255,255,0.85); }
  .combo-btn .price { background: #fff; color: var(--accent-3); }
  .combo-btn:active { background: linear-gradient(150deg, #e83fae, #e864bd 60%, #e893cc); }

  /* Flip cards (flavors) */
  .flip-card {
    perspective: 800px;
    min-height: 62px;
    height: 100%;
  }
  .flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 62px;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  body.show-flavors .flip-card .flip-inner {
    transform: rotateY(180deg);
  }
  .flip-front, .flip-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
  }
  .flip-back {
    transform: rotateY(180deg);
    background: var(--panel-2);
    justify-content: center;
  }
  .flavors {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent-3);
    line-height: 1.4;
    padding: 0 4px;
  }

  /* Cart */
  .cart-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .cart-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 2px solid var(--border);
    font-size: 0.88rem;
    gap: 8px;
  }
  .cart-row:last-child { border-bottom: none; }
  .cart-row .name {
    flex: 1;
    font-weight: 600;
    min-width: 0;
  }
  .cart-row .unit-price {
    display: block;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 400;
    margin-top: 1px;
  }
  .cart-row .combo-detail {
    display: block;
    color: var(--accent-3);
    font-size: 0.72rem;
    font-weight: 600;
    margin-top: 2px;
    line-height: 1.35;
  }
  .cart-row .qty-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 3px;
  }
  .qty-controls button {
    background: #fff;
    border: 1.5px solid var(--border);
    color: var(--accent-3);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 800;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qty-controls button:active { background: var(--accent); color: #fff; transform: scale(0.92); }
  .qty-controls span {
    min-width: 18px;
    text-align: center;
    font-weight: 700;
    font-size: 0.85rem;
  }
  .cart-row .line-total {
    min-width: 66px;
    text-align: right;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.85rem;
  }
  .cart-empty {
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
    font-style: italic;
    font-size: 0.85rem;
  }
  .remove-btn {
    background: transparent;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 1.1rem;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .remove-btn:active { background: rgba(229,57,95,0.12); }

  .reminder {
    text-align: center;
    color: var(--muted);
    font-size: 0.72rem;
    margin-bottom: 6px;
  }

  .total-box {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    margin-bottom: 10px;
    box-shadow: 0 6px 18px rgba(255,79,195,0.3);
    flex-shrink: 0;
  }
  .total-box .label {
    color: rgba(255,255,255,0.85);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .total-box .amount {
    font-size: 2rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .clear-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 2px solid var(--danger);
    color: var(--danger);
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .clear-btn:active { background: rgba(229,57,95,0.12); }

</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo.png" alt="UwU Cafe">
  <div>
    <h1>UwU Cafe - Caisse</h1>
    <div class="sub">Menu Event</div>
  </div>
  <div class="header-actions">
    <button class="flavors-toggle" id="menuToggle" type="button">Event</button>
    <button class="flavors-toggle" id="flavorsToggle" type="button">Saveurs</button>
  </div>
</header>

<div class="layout">
  <div class="combos-bar">
    <div class="card combos-card">
      <div class="section-nav">
        <button class="section-arrow" id="combosPrev">‹</button>
        <div class="section-title section-title-nav" id="combosTitle">Combos</div>
        <button class="section-arrow" id="combosNext">›</button>
      </div>
      <div class="grid-items" id="combos"></div>
    </div>
  </div>

  <div class="lower">
    <div class="menu-cols">
      <div class="menu-col" id="boissonCol"></div>
      <div class="menu-col" id="nourritureCol"></div>
    </div>

    <div class="cart-panel card">
      <div class="section-title">Panier</div>
      <div class="cart-list" id="cartList">
        <div class="cart-empty">Aucun article</div>
      </div>

      <div class="reminder">Ne pas oublier de faire la capture d'écran</div>

      <div class="total-box">
        <div class="label">Total</div>
        <div class="amount" id="totalAmount">0$</div>
      </div>

      <button class="clear-btn" id="clearCart">Vider le panier</button>
    </div>
  </div>
</div>

<script>
  const MENUS = {
    event: {
      label: "Menu Event",
      combos: [
        {
          name: "Le Ptit Nouveau", price: 3000,
          contents: [{ label: "Boissons", qty: 2 }, { label: "Sucrées", qty: 2 }],
        },
        {
          name: "Le Chejeûner", price: 5000,
          contents: [{ label: "Boissons", qty: 3 }, { label: "Plats", qty: 3 }],
        },
        {
          name: "Le Mini Senior", price: 7000,
          contents: [{ label: "Boissons Froides", qty: 3 }, { label: "Boissons Chaudes", qty: 3 }, { label: "Plats", qty: 3 }],
        },
        {
          name: "Le Sphinx Malin", price: 15000,
          contents: [{ label: "Boissons Froides", qty: 5 }, { label: "Plats", qty: 5 }, { label: "Sucrées", qty: 5 }, { label: "Boissons Chaudes", qty: 5 }],
        },
      ],
      boissonSections: [
        {
          title: "Boissons",
          items: [
            { name: "Café", price: 400 },
            { name: "Thé Matcha", price: 400 },
            { name: "Frappé Glacé", price: 400 },
            { name: "Jus de Fruit", price: 500, flavors: ["Fraise", "Orange"] },
            { name: "Ice Tea", price: 600 },
          ],
        },
      ],
      nourritureSections: [
        {
          title: "Nourriture",
          items: [
            { name: "Sucette", price: 300, flavors: ["Cerise", "Fraise"] },
            { name: "Barbe à papa", price: 300, flavors: ["Kiwi", "Framboise"] },
            { name: "Glace", price: 600, flavors: ["Vanille", "Chocolat", "Fraise", "Pistache"] },
            { name: "Rouleau de Printemps", price: 700 },
            { name: "Nem Poulet", price: 700 },
          ],
        },
      ],
    },
    normal: {
      label: "Menu Normal",
      combos: [
        {
          name: "Le Ptit Nouveau", price: 3000,
          contents: [{ label: "Boissons", qty: 2 }, { label: "Sucrées", qty: 2 }],
        },
        {
          name: "Le Chaton", price: 3500,
          contents: [{ label: "Jus de Fruits", qty: 3 }, { label: "Sucrées", qty: 4 }],
        },
        {
          name: "Le Matounal", price: 4000,
          contents: [{ label: "Jus de Fruits", qty: 3 }, { label: "Boissons Chaudes", qty: 3 }, { label: "Sucrées", qty: 3 }],
        },
        {
          name: "Le Ptit Goûter", price: 4500,
          contents: [{ label: "Bubble Tea", qty: 2 }, { label: "Boissons Chaudes", qty: 2 }, { label: "Sucrées", qty: 3 }],
        },
        {
          name: "Le Chejeûner", price: 5000,
          contents: [{ label: "Boissons", qty: 3 }, { label: "Plats", qty: 3 }],
        },
        {
          name: "Le Mini Senior", price: 7000,
          contents: [{ label: "Boissons Froides", qty: 3 }, { label: "Boissons Chaudes", qty: 3 }, { label: "Plats", qty: 3 }],
        },
        {
          name: "Le Sphinx Malin", price: 15000,
          contents: [{ label: "Boissons Froides", qty: 5 }, { label: "Plats", qty: 5 }, { label: "Sucrées", qty: 5 }, { label: "Boissons Chaudes", qty: 5 }],
        },
        {
          name: "Policat", price: 2000,
          contents: [{ label: "Café", qty: 3 }, { label: "Donut Fraise", qty: 3 }],
        },
        {
          name: "La Zefrai", price: 9000,
          contents: [{ label: "Bubble Tea Fraise", qty: 5 }, { label: "Mochi Fraise", qty: 5 }, { label: "Donut Fraise", qty: 5 }, { label: "Junk Energie Rose", qty: 5 }],
        },
        {
          name: "Panda Brun", price: 10000,
          contents: [{ label: "Bubble Tea Chocolat", qty: 5 }, { label: "Café Latté", qty: 5 }, { label: "Glace Vanille", qty: 5 }, { label: "Mochi Chocolat", qty: 5 }],
        },
      ],
      boissonSections: [
        {
          title: "Boissons Chaudes",
          items: [
            { name: "Café", price: 400 },
            { name: "Thé Matcha", price: 400 },
            { name: "Café Latte", price: 600 },
            { name: "Cappucino", price: 600 },
            { name: "Chocolat Chaud", price: 600 },
            { name: "Thé Vert", price: 700 },
          ],
        },
        {
          title: "Boissons Froides",
          items: [
            { name: "Frappé Glacé", price: 400 },
            { name: "Jus de Fruit", price: 500, flavors: ["Pomme", "Orange", "Fraise", "Kiwi", "Banane"] },
            { name: "Bouteille de Lait", price: 500 },
            { name: "Ice Tea", price: 600 },
            { name: "Junk Energie", price: 700, flavors: ["Rose", "Violet", "Vert", "Jaune"] },
            { name: "Bubble Tea", price: 700, flavors: ["Chocolat", "Fraise", "Framboise", "Pêche", "Kiwi", "Exotic"] },
          ],
        },
      ],
      nourritureSections: [
        {
          title: "Nourriture Sucrée",
          items: [
            { name: "Sucette", price: 300, flavors: ["Cerise", "Fraise", "Framboise", "Orange", "Citron"] },
            { name: "Donut", price: 500, flavors: ["Fraise", "Chocolat", "Kiwi"] },
            { name: "Glace", price: 600, flavors: ["Vanille", "Chocolat", "Fraise", "Pistache", "Cerise", "Framboise"] },
            { name: "Mochi", price: 600, flavors: ["Fraise", "Chocolat"] },
            { name: "CheeseCake", price: 700 },
            { name: "Churros Chocolat", price: 700 },
          ],
        },
        {
          title: "Nourriture Salée",
          items: [
            { name: "Rouleau de Printemps", price: 700 },
            { name: "Sushis", price: 850 },
            { name: "Tacos", price: 850 },
            { name: "Nachos", price: 900 },
          ],
        },
      ],
    },
  };

  let currentMenu = 'normal';
  let boissonIndex = 0;
  let nourritureIndex = 0;
  let comboPage = 0;

  let cart = [];
  let lastAddKey = '';
  let lastAddTime = 0;

  function fmt(n) {
    return n.toLocaleString('fr-FR') + '$';
  }

  function addToCartDebounced(name, price, contents) {
    const key = name + '|' + price;
    const now = Date.now();
    if (key === lastAddKey && now - lastAddTime < 150) return;
    lastAddKey = key;
    lastAddTime = now;
    addToCart(name, price, contents);
  }

  function contentsLabel(contents, multiplier) {
    return contents.map(c => `${c.qty * multiplier}x ${c.label}`).join(', ');
  }

  const COMBOS_PER_PAGE = 4;

  function renderMenu() {
    document.querySelector('header .sub').textContent = MENUS[currentMenu].label;
    comboPage = 0;
    renderCombos();
    boissonIndex = 0;
    nourritureIndex = 0;
    renderCarousel('boissonCol', MENUS[currentMenu].boissonSections, boissonIndex, (i) => { boissonIndex = i; });
    renderCarousel('nourritureCol', MENUS[currentMenu].nourritureSections, nourritureIndex, (i) => { nourritureIndex = i; });
  }

  function renderCombos() {
    const menu = MENUS[currentMenu];
    const paginated = currentMenu !== 'event';
    const pageCount = paginated ? Math.ceil(menu.combos.length / COMBOS_PER_PAGE) : 1;
    const pageItems = paginated
      ? menu.combos.slice(comboPage * COMBOS_PER_PAGE, comboPage * COMBOS_PER_PAGE + COMBOS_PER_PAGE)
      : menu.combos;

    document.getElementById('combosTitle').textContent = paginated ? `Combos (${comboPage + 1}/${pageCount})` : 'Combos';
    document.getElementById('combosPrev').disabled = !paginated || pageCount <= 1;
    document.getElementById('combosNext').disabled = !paginated || pageCount <= 1;
    document.getElementById('combosPrev').style.visibility = paginated ? 'visible' : 'hidden';
    document.getElementById('combosNext').style.visibility = paginated ? 'visible' : 'hidden';

    const comboEl = document.getElementById('combos');
    comboEl.innerHTML = '';
    pageItems.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'item-btn combo-btn';
      btn.innerHTML = `<span class="name"><span class="title">${item.name}</span><span class="desc">${contentsLabel(item.contents, 1)}</span></span><span class="price">${fmt(item.price)}</span>`;
      btn.onclick = () => addToCartDebounced(item.name, item.price, item.contents);
      comboEl.appendChild(btn);
    });
  }

  function renderCarousel(colId, sections, index, setIndex) {
    const menuCol = document.getElementById(colId);
    menuCol.innerHTML = '';

    if (currentMenu === 'event') {
      sections.forEach(section => {
        const card = document.createElement('div');
        card.className = 'card';
        const title = document.createElement('div');
        title.className = 'section-title';
        title.textContent = section.title;
        const grid = document.createElement('div');
        grid.className = 'grid-items';
        section.items.forEach(item => grid.appendChild(createItemCard(item)));
        card.appendChild(title);
        card.appendChild(grid);
        menuCol.appendChild(card);
      });
      return;
    }

    const section = sections[index];

    const card = document.createElement('div');
    card.className = 'card section-card';

    const nav = document.createElement('div');
    nav.className = 'section-nav';

    const prevBtn = document.createElement('button');
    prevBtn.className = 'section-arrow';
    prevBtn.textContent = '‹';
    prevBtn.disabled = sections.length <= 1;
    prevBtn.onclick = () => {
      const newIndex = (index - 1 + sections.length) % sections.length;
      setIndex(newIndex);
      renderCarousel(colId, sections, newIndex, setIndex);
    };

    const title = document.createElement('div');
    title.className = 'section-title section-title-nav';
    title.textContent = `${section.title} (${index + 1}/${sections.length})`;

    const nextBtn = document.createElement('button');
    nextBtn.className = 'section-arrow';
    nextBtn.textContent = '›';
    nextBtn.disabled = sections.length <= 1;
    nextBtn.onclick = () => {
      const newIndex = (index + 1) % sections.length;
      setIndex(newIndex);
      renderCarousel(colId, sections, newIndex, setIndex);
    };

    nav.appendChild(prevBtn);
    nav.appendChild(title);
    nav.appendChild(nextBtn);

    const grid = document.createElement('div');
    grid.className = 'grid-items';
    section.items.forEach(item => grid.appendChild(createItemCard(item)));

    card.appendChild(nav);
    card.appendChild(grid);
    menuCol.appendChild(card);
  }

  function createItemCard(item) {
    if (!item.flavors) {
      const btn = document.createElement('button');
      btn.className = 'item-btn';
      btn.innerHTML = `<span class="name">${item.name}</span><span class="price">${fmt(item.price)}</span>`;
      btn.onclick = () => addToCartDebounced(item.name, item.price);
      return btn;
    }

    const flip = document.createElement('div');
    flip.className = 'flip-card';

    const inner = document.createElement('div');
    inner.className = 'flip-inner';

    const front = document.createElement('button');
    front.className = 'item-btn flip-front';
    front.innerHTML = `<span class="name">${item.name}</span><span class="price">${fmt(item.price)}</span>`;
    front.onclick = () => addToCartDebounced(item.name, item.price);

    const back = document.createElement('button');
    back.className = 'item-btn flip-back';
    back.innerHTML = `<span class="flavors">${item.flavors.join(' · ')}</span>`;
    back.onclick = () => addToCartDebounced(item.name, item.price);

    inner.appendChild(front);
    inner.appendChild(back);
    flip.appendChild(inner);
    return flip;
  }

  function addToCart(name, price, contents) {
    const existing = cart.find(c => c.name === name && c.price === price);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ name, price, qty: 1, contents });
    }
    renderCart();
  }

  function changeQty(index, delta) {
    cart[index].qty += delta;
    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }
    renderCart();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function renderCart() {
    const listEl = document.getElementById('cartList');
    listEl.innerHTML = '';

    if (cart.length === 0) {
      listEl.innerHTML = '<div class="cart-empty">Aucun article</div>';
    } else {
      cart.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'cart-row';
        const detail = item.contents
          ? `<span class="combo-detail">${contentsLabel(item.contents, item.qty)}</span>`
          : `<span class="unit-price">${fmt(item.price)} / unité</span>`;
        row.innerHTML = `
          <span class="name">${item.name}${detail}</span>
          <span class="qty-controls">
            <button data-action="dec">-</button>
            <span>${item.qty}</span>
            <button data-action="inc">+</button>
          </span>
          <span class="line-total">${fmt(item.price * item.qty)}</span>
          <button class="remove-btn" data-action="remove">✕</button>
        `;
        row.querySelector('[data-action="dec"]').onclick = () => changeQty(index, -1);
        row.querySelector('[data-action="inc"]').onclick = () => changeQty(index, 1);
        row.querySelector('[data-action="remove"]').onclick = () => removeItem(index);
        listEl.appendChild(row);
      });
    }

    updateTotal();
  }

  function getTotal() {
    return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  }

  function updateTotal() {
    document.getElementById('totalAmount').textContent = fmt(getTotal());
  }

  document.getElementById('clearCart').onclick = () => {
    cart = [];
    renderCart();
  };

  document.getElementById('flavorsToggle').onclick = (e) => {
    document.body.classList.toggle('show-flavors');
    e.currentTarget.classList.toggle('active');
  };

  document.getElementById('menuToggle').onclick = (e) => {
    currentMenu = currentMenu === 'event' ? 'normal' : 'event';
    e.currentTarget.textContent = currentMenu === 'event' ? 'Normal' : 'Event';
    e.currentTarget.classList.toggle('active', currentMenu === 'normal');
    document.body.classList.remove('show-flavors');
    document.getElementById('flavorsToggle').classList.remove('active');
    renderMenu();
  };

  document.getElementById('combosPrev').onclick = () => {
    const pageCount = Math.ceil(MENUS[currentMenu].combos.length / COMBOS_PER_PAGE);
    comboPage = (comboPage - 1 + pageCount) % pageCount;
    renderCombos();
  };
  document.getElementById('combosNext').onclick = () => {
    const pageCount = Math.ceil(MENUS[currentMenu].combos.length / COMBOS_PER_PAGE);
    comboPage = (comboPage + 1) % pageCount;
    renderCombos();
  };

  renderMenu();
  renderCart();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>

</body>
</html>
