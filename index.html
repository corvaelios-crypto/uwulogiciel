<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UwU Cafe - Caisse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%90%B1</text></svg>">
<style>
  :root {
    --bg-1: #fdf1fa;
    --bg-2: #ffe3f4;
    --panel: rgba(255,255,255,0.75);
    --panel-2: #fff0fb;
    --accent: #ff4fc3;
    --accent-2: #ff7ad1;
    --accent-3: #c93fb0;
    --text: #3a1030;
    --muted: #9a6a90;
    --border: rgba(255,79,195,0.18);
    --danger: #e5395f;
    --shadow: 0 8px 24px rgba(255,79,195,0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    overscroll-behavior: none;
    touch-action: manipulation;
    height: 100%;
  }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,122,209,0.25), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(255,79,195,0.15), transparent 50%),
      linear-gradient(180deg, var(--bg-2), var(--bg-1));
    background-attachment: fixed;
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  header {
    position: relative;
    text-align: center;
    padding: 10px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .flavors-toggle {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: #fff;
    border: 2px solid var(--accent);
    color: var(--accent-3);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(255,79,195,0.15);
  }
  .flavors-toggle:active { transform: translateY(-50%) scale(0.95); }
  .flavors-toggle.active {
    background: var(--accent);
    color: #fff;
  }
  header .logo {
    width: 40px;
    height: 40px;
    object-fit: contain;
    filter: drop-shadow(0 3px 6px rgba(255,79,195,0.35));
  }
  header h1 {
    margin: 0;
    font-size: 1.3rem;
    letter-spacing: 0.3px;
    font-weight: 800;
    color: var(--accent-3);
  }
  header .sub {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
  }

  .layout {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 1300px;
    width: 100%;
    margin: 0 auto;
    padding: 0 12px 12px;
  }

  .combos-bar { flex-shrink: 0; }

  .lower {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 10px;
  }
  @media (max-width: 780px) {
    .lower {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
  }

  .menu-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .menu-col .card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .menu-col .grid-items {
    flex: 1;
    min-height: 0;
    align-content: center;
  }

  .card {
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card.combos-card { padding: 10px 12px; }
  .cart-panel.card {
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
  }

  .section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin: 0 0 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 13px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), var(--accent-3));
  }

  .grid-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    grid-auto-rows: 1fr;
    gap: 8px;
  }
  .combos-bar .grid-items {
    grid-template-columns: repeat(4, 1fr);
  }
  @media (max-width: 780px) {
    .combos-bar .grid-items {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .item-btn {
    position: relative;
    background: #ffffff;
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 8px 6px 7px;
    cursor: pointer;
    text-align: center;
    font-size: 0.78rem;
    font-weight: 700;
    line-height: 1.2;
    min-height: 62px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    box-shadow: 0 2px 6px rgba(255,79,195,0.12);
  }
  .item-btn .name {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
  }
  .item-btn:active {
    transform: scale(0.94);
    background: var(--panel-2);
    box-shadow: 0 1px 3px rgba(255,79,195,0.12);
  }
  .item-btn .title {
    font-size: 0.85rem;
  }
  .item-btn .desc {
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--muted);
  }
  .item-btn .price {
    display: inline-block;
    color: #fff;
    background: var(--accent);
    font-weight: 800;
    font-size: 0.78rem;
    padding: 2px 9px;
    border-radius: 20px;
  }
  .combo-btn {
    background: linear-gradient(150deg, #ff4fc3, #ff7ad1 60%, #ffa8e0);
    border: 2px solid rgba(255,255,255,0.6);
    min-height: 88px;
    padding: 10px 10px 9px;
  }
  .combo-btn .name {
    flex-direction: column;
    gap: 2px;
  }
  .combo-btn, .combo-btn .desc { color: #fff; }
  .combo-btn .desc { color: rgba(255,255,255,0.85); }
  .combo-btn .price { background: #fff; color: var(--accent-3); }
  .combo-btn:active { background: linear-gradient(150deg, #e83fae, #e864bd 60%, #e893cc); }

  /* Flip cards (flavors) */
  .flip-card {
    perspective: 800px;
    min-height: 62px;
    height: 100%;
  }
  .flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 62px;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  body.show-flavors .flip-card .flip-inner {
    transform: rotateY(180deg);
  }
  .flip-front, .flip-back {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
  }
  .flip-back {
    transform: rotateY(180deg);
    background: var(--panel-2);
    justify-content: center;
  }
  .flavors {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent-3);
    line-height: 1.4;
    padding: 0 4px;
  }

  /* Cart */
  .cart-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .cart-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 2px solid var(--border);
    font-size: 0.88rem;
    gap: 8px;
  }
  .cart-row:last-child { border-bottom: none; }
  .cart-row .name {
    flex: 1;
    font-weight: 600;
    min-width: 0;
  }
  .cart-row .unit-price {
    display: block;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 400;
    margin-top: 1px;
  }
  .cart-row .qty-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 3px;
  }
  .qty-controls button {
    background: #fff;
    border: 1.5px solid var(--border);
    color: var(--accent-3);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 800;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qty-controls button:active { background: var(--accent); color: #fff; transform: scale(0.92); }
  .qty-controls span {
    min-width: 18px;
    text-align: center;
    font-weight: 700;
    font-size: 0.85rem;
  }
  .cart-row .line-total {
    min-width: 66px;
    text-align: right;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.85rem;
  }
  .cart-empty {
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
    font-style: italic;
    font-size: 0.85rem;
  }
  .remove-btn {
    background: transparent;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 1.1rem;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .remove-btn:active { background: rgba(229,57,95,0.12); }

  .total-box {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    margin-bottom: 10px;
    box-shadow: 0 6px 18px rgba(255,79,195,0.3);
    flex-shrink: 0;
  }
  .total-box .label {
    color: rgba(255,255,255,0.85);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .total-box .amount {
    font-size: 2rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .clear-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 2px solid var(--danger);
    color: var(--danger);
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .clear-btn:active { background: rgba(229,57,95,0.12); }

</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo.png" alt="UwU Cafe">
  <div>
    <h1>UwU Cafe - Caisse</h1>
    <div class="sub">Menu Event</div>
  </div>
  <button class="flavors-toggle" id="flavorsToggle" type="button">🍓 Saveurs</button>
</header>

<div class="layout">
  <div class="combos-bar">
    <div class="card combos-card">
      <div class="section-title">Combos</div>
      <div class="grid-items" id="combos"></div>
    </div>
  </div>

  <div class="lower">
    <div class="menu-col">
      <div class="card">
        <div class="section-title">Boissons</div>
        <div class="grid-items" id="boissons"></div>
      </div>

      <div class="card">
        <div class="section-title">Nourriture</div>
        <div class="grid-items" id="nourriture"></div>
      </div>
    </div>

    <div class="cart-panel card">
      <div class="section-title">Panier</div>
      <div class="cart-list" id="cartList">
        <div class="cart-empty">Aucun article</div>
      </div>

      <div class="total-box">
        <div class="label">Total</div>
        <div class="amount" id="totalAmount">0$</div>
      </div>

      <button class="clear-btn" id="clearCart">Vider le panier</button>
    </div>
  </div>
</div>

<script>
  const MENU = {
    combos: [
      { name: "Le Ptit Nouveau", desc: "2x Boissons, 2x Sucrées", price: 3000 },
      { name: "Le Chejeûner", desc: "3x Boissons, 3x Plats", price: 5000 },
      { name: "Le Mini Senior", desc: "3x Boissons Froides, 3x Boissons Chaudes, 3x Plats", price: 7000 },
      { name: "Le Sphinx Malin", desc: "5x Boissons Froides, 5x Plats, 5x Sucrées, 5x Boissons Chaudes", price: 15000 },
    ],
    boissons: [
      { name: "Café", price: 400 },
      { name: "Thé Matcha", price: 400 },
      { name: "Frappé Glacé", price: 400 },
      { name: "Jus de Fruit", price: 500, flavors: ["Fraise", "Orange"] },
      { name: "Ice Tea", price: 600 },
    ],
    nourriture: [
      { name: "Sucette", price: 300, flavors: ["Cerise", "Fraise"] },
      { name: "Barbe à papa", price: 300, flavors: ["Kiwi", "Framboise"] },
      { name: "Glace", price: 600, flavors: ["Vanille", "Chocolat", "Fraise", "Pistache"] },
      { name: "Rouleau de Printemps", price: 700 },
      { name: "Nem Poulet", price: 700 },
    ],
  };

  let cart = [];

  function fmt(n) {
    return n.toLocaleString('fr-FR') + '$';
  }

  function renderMenu() {
    const comboEl = document.getElementById('combos');
    MENU.combos.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'item-btn combo-btn';
      btn.innerHTML = `<span class="name"><span class="title">${item.name}</span><span class="desc">${item.desc}</span></span><span class="price">${fmt(item.price)}</span>`;
      btn.onclick = () => addToCart(item.name, item.price);
      comboEl.appendChild(btn);
    });

    const boissonEl = document.getElementById('boissons');
    MENU.boissons.forEach(item => boissonEl.appendChild(createItemCard(item)));

    const nourritureEl = document.getElementById('nourriture');
    MENU.nourriture.forEach(item => nourritureEl.appendChild(createItemCard(item)));
  }

  function createItemCard(item) {
    if (!item.flavors) {
      const btn = document.createElement('button');
      btn.className = 'item-btn';
      btn.innerHTML = `<span class="name">${item.name}</span><span class="price">${fmt(item.price)}</span>`;
      btn.onclick = () => addToCart(item.name, item.price);
      return btn;
    }

    const flip = document.createElement('div');
    flip.className = 'flip-card';

    const inner = document.createElement('div');
    inner.className = 'flip-inner';

    const front = document.createElement('button');
    front.className = 'item-btn flip-front';
    front.innerHTML = `<span class="name">${item.name}</span><span class="price">${fmt(item.price)}</span>`;
    front.onclick = () => addToCart(item.name, item.price);

    const back = document.createElement('button');
    back.className = 'item-btn flip-back';
    back.innerHTML = `<span class="flavors">${item.flavors.join(' · ')}</span>`;
    back.onclick = () => addToCart(item.name, item.price);

    inner.appendChild(front);
    inner.appendChild(back);
    flip.appendChild(inner);
    return flip;
  }

  function addToCart(name, price) {
    const existing = cart.find(c => c.name === name && c.price === price);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ name, price, qty: 1 });
    }
    renderCart();
  }

  function changeQty(index, delta) {
    cart[index].qty += delta;
    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }
    renderCart();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function renderCart() {
    const listEl = document.getElementById('cartList');
    listEl.innerHTML = '';

    if (cart.length === 0) {
      listEl.innerHTML = '<div class="cart-empty">Aucun article</div>';
    } else {
      cart.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'cart-row';
        row.innerHTML = `
          <span class="name">${item.name}<span class="unit-price">${fmt(item.price)} / unité</span></span>
          <span class="qty-controls">
            <button data-action="dec">-</button>
            <span>${item.qty}</span>
            <button data-action="inc">+</button>
          </span>
          <span class="line-total">${fmt(item.price * item.qty)}</span>
          <button class="remove-btn" data-action="remove">✕</button>
        `;
        row.querySelector('[data-action="dec"]').onclick = () => changeQty(index, -1);
        row.querySelector('[data-action="inc"]').onclick = () => changeQty(index, 1);
        row.querySelector('[data-action="remove"]').onclick = () => removeItem(index);
        listEl.appendChild(row);
      });
    }

    updateTotal();
  }

  function getTotal() {
    return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  }

  function updateTotal() {
    document.getElementById('totalAmount').textContent = fmt(getTotal());
  }

  document.getElementById('clearCart').onclick = () => {
    cart = [];
    renderCart();
  };

  document.getElementById('flavorsToggle').onclick = (e) => {
    document.body.classList.toggle('show-flavors');
    e.currentTarget.classList.toggle('active');
  };

  renderMenu();
  renderCart();
</script>

</body>
</html>
